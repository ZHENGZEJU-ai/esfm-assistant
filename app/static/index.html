<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静电驱动与静电吸附 · 科研知识库</title>
<style>
  :root{--bg:#faf9f7;--card:#fff;--ink:#1c1b19;--mute:#6b6862;--faint:#9a958d;
        --line:#e5e2dc;--accent:#8a5a2b;
        --fm:#2b5d8a;--fmbg:#eef4fb;--fmline:#cfe0f2;
        --ea:#7a3d8a;--eabg:#f7eff9;--ealine:#e7d3ee}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);min-height:100vh;
       font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1060px;margin:0 auto;padding:64px 24px 60px}
  .head{text-align:center;margin-bottom:44px}
  h1{font-size:28px;margin:0 0 8px;letter-spacing:-.3px;font-weight:600}
  .sub{color:var(--mute);font-size:14px}

  .split{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media(max-width:760px){.split{grid-template-columns:1fr}}

  .side{position:relative;display:block;text-decoration:none;color:inherit;
        background:var(--card);border:1px solid var(--line);border-radius:16px;
        padding:34px 30px 28px;overflow:hidden;
        transition:transform .18s, box-shadow .18s, border-color .18s}
  .side:hover{transform:translateY(-3px)}
  .side .stripe{position:absolute;left:0;top:0;bottom:0;width:4px}
  .side.fm{border-color:var(--fmline)}
  .side.fm .stripe{background:var(--fm)}
  .side.fm:hover{box-shadow:0 10px 30px rgba(43,93,138,.13);border-color:var(--fm)}
  .side.ea{border-color:var(--ealine)}
  .side.ea .stripe{background:var(--ea)}
  .side.ea:hover{box-shadow:0 10px 30px rgba(122,61,138,.13);border-color:var(--ea)}

  .glyph{width:52px;height:52px;margin-bottom:16px}
  .side h2{font-size:21px;margin:0 0 4px;font-weight:600}
  .side .en{font-size:12px;color:var(--faint);letter-spacing:.4px;margin-bottom:12px}
  .side p{margin:0 0 18px;font-size:13.5px;color:var(--mute);line-height:1.75;min-height:66px}

  .facts{display:flex;gap:0;border-top:1px solid var(--line);padding-top:14px;margin-bottom:16px}
  .facts div{flex:1}
  .facts b{display:block;font-size:20px;font-weight:600;letter-spacing:-.3px}
  .facts span{font-size:11px;color:var(--faint)}
  .side.fm .facts b{color:var(--fm)}
  .side.ea .facts b{color:var(--ea)}

  .subs{display:flex;gap:8px}
  .pill{flex:1;text-align:center;font-size:12.5px;padding:8px 6px;border-radius:8px;
        border:1px solid var(--line);color:var(--mute)}
  .side.fm .pill{background:var(--fmbg);border-color:var(--fmline);color:var(--fm)}
  .side.ea .pill{background:var(--eabg);border-color:var(--ealine);color:var(--ea)}
  .enter{margin-top:16px;font-size:13px;font-weight:500}
  .side.fm .enter{color:var(--fm)}
  .side.ea .enter{color:var(--ea)}

  .foot{text-align:center;margin-top:40px;font-size:12px;color:var(--faint);line-height:2}
  .foot a{color:var(--mute);text-decoration:none;border-bottom:1px solid var(--line)}
  .foot a:hover{color:var(--accent)}
  .err{text-align:center;color:#a33;font-size:13px;margin-top:20px}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <h1>静电驱动与静电吸附 · 科研知识库</h1>
    <div class="sub" id="sub">加载中…</div>
  </div>

  <div class="split">
    <a class="side fm" href="/fm">
      <div class="stripe"></div>
      <svg class="glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="4" y="13" width="40" height="7" rx="1.5" fill="#eef4fb" stroke="#2b5d8a" stroke-width="1.6"/>
        <path d="M8 20v4M16 20v4M24 20v4M32 20v4M40 20v4" stroke="#2b5d8a" stroke-width="1.6"/>
        <rect x="10" y="27" width="24" height="7" rx="1.5" fill="#cfe0f2" stroke="#2b5d8a" stroke-width="1.6"/>
        <path d="M36 30.5h9M41 26.5l4.5 4-4.5 4" stroke="#2b5d8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>静电薄膜电机</h2>
      <div class="en">ELECTROSTATIC FILM MOTOR</div>
      <p>行波或步进电场驱动滑块产生相对运动。关注推力密度、驱动电压、多相激励与位置控制。</p>
      <div class="facts" id="fm-facts"></div>
      <div class="subs"><span class="pill">知识库</span><span class="pill">学习路径</span></div>
      <div class="enter">进入 →</div>
    </a>

    <a class="side ea" href="/ea">
      <div class="stripe"></div>
      <svg class="glyph" viewBox="0 0 48 48" fill="none" aria-hidden="true">
        <rect x="7" y="9" width="34" height="8" rx="1.5" fill="#f7eff9" stroke="#7a3d8a" stroke-width="1.6"/>
        <path d="M13 17v5M21 17v5M27 17v5M35 17v5" stroke="#7a3d8a" stroke-width="1.6"/>
        <path d="M13 22c0 3 3 3 3 0M21 22c0 3 3 3 3 0M27 22c0 3 3 3 3 0" stroke="#7a3d8a" stroke-width="1.4" opacity=".55"/>
        <rect x="5" y="29" width="38" height="9" rx="2" fill="#e7d3ee" stroke="#7a3d8a" stroke-width="1.6"/>
        <path d="M24 26v-4M21.5 24l2.5-2.5 2.5 2.5" stroke="#7a3d8a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <h2>静电吸附 / 电粘附</h2>
      <div class="en">ELECTROADHESION</div>
      <p>静电力产生法向吸附与剪切握持。关注吸附力、接触界面、夹持器、爬壁与可穿戴触觉。</p>
      <div class="facts" id="ea-facts"></div>
      <div class="subs"><span class="pill">知识库</span><span class="pill">学习路径</span></div>
      <div class="enter">进入 →</div>
    </a>
  </div>

  <div class="foot">
    两个方向的文献、统计与学习路径完全分开。<br>
    需要跨方向查找时，可进入 <a href="/all">全库视图</a>。
  </div>
  <div class="err" id="err"></div>
</div>

<script>
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 两侧的数字各自单独取，保证与进入后看到的完全一致 —— 不在这里做减法拼凑
Promise.all([
  fetch('/api/stats').then(r=>r.json()),
  fetch('/api/overview?domain=fm').then(r=>r.json()),
  fetch('/api/overview?domain=ea').then(r=>r.json()),
]).then(([s, fm, ea])=>{
  $('#sub').textContent = `${s.papers} 篇论文 · ${s.chunks} 段全文 · ${s.year_min}–${s.year_max}`;
  const facts = o => [
    ['论文', o.totals.papers],
    ['段落', o.totals.chunks ?? '—'],
    ['被引', o.totals.cited.toLocaleString()],
    ['研究者', o.totals.authors],
  ].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('');
  // chunks 不在 overview 里，从 stats 的分类统计补上
  const chunkOf = k => (s.categories||[]).find(c=>c.key===k)?.chunks ?? '—';
  fm.totals.chunks = chunkOf('film_motor');
  ea.totals.chunks = chunkOf('electroadhesion');
  $('#fm-facts').innerHTML = facts(fm);
  $('#ea-facts').innerHTML = facts(ea);
}).catch(e=>{ $('#sub').textContent='后端未就绪'; $('#err').textContent=e; });
</script>
</body>
</html>
