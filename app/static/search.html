<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>静电薄膜电机 · 文献知识助手</title>
<style>
  :root{--bg:#faf9f7;--card:#fff;--ink:#1c1b19;--mute:#6b6862;--line:#e5e2dc;--accent:#8a5a2b;--hl:#fdf0d5}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:920px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--mute);font-size:13px;margin-bottom:22px}
  .bar{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
  textarea{width:100%;border:0;outline:0;resize:vertical;min-height:64px;font:inherit;background:transparent}
  .opts{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
  select,input[type=number]{font:inherit;font-size:13px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink)}
  input[type=number]{width:78px}
  label{font-size:13px;color:var(--mute)}
  button{font:inherit;font-size:14px;padding:7px 18px;border:0;border-radius:8px;background:var(--accent);color:#fff;cursor:pointer}
  button.ghost{background:transparent;color:var(--mute);border:1px solid var(--line)}
  button:disabled{opacity:.45;cursor:default}
  .spacer{flex:1}
  .answer{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:20px;white-space:pre-wrap;word-break:break-word}
  .answer sup{color:var(--accent);cursor:pointer;font-weight:600}
  .cards{margin-top:20px;display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:13px 15px}
  .card.flash{animation:fl 1.1s ease}
  @keyframes fl{from{background:var(--hl)}to{background:var(--card)}}
  .ct{font-weight:600;font-size:14px;margin-bottom:3px}
  .cm{font-size:12px;color:var(--mute);margin-bottom:7px}
  .cp{font-size:13px;color:#3a3833;background:var(--bg);padding:8px 10px;border-radius:7px;border-left:2px solid var(--line)}
  .cp b{background:var(--hl);font-weight:600;padding:0 1px}
  .badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:20px;background:var(--hl);color:var(--accent);margin-right:6px}
  .cat{display:flex;gap:0;margin-bottom:14px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
  .cat button{flex:1;background:transparent;color:var(--mute);border:0;border-right:1px solid var(--line);padding:11px 8px;text-align:center;line-height:1.35}
  .cat button:last-child{border-right:0}
  .cat button.on{background:var(--accent);color:#fff}
  .cat b{display:block;font-size:14px;font-weight:600}
  .cat span{font-size:11px;opacity:.75}
  .cbadge{display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;margin-right:6px;border:1px solid var(--line);color:var(--mute)}
  .cbadge.fm{background:#eef4fb;color:#2b5d8a;border-color:#d3e2f2}
  .cbadge.ea{background:#f6eef8;color:#7a3d8a;border-color:#e8d6ee}
  .cbadge.x{background:#fdf0d5;color:#8a5a2b;border-color:#f0dcb4}
  .rt{font-size:11px;color:#a09a90;margin-left:6px}
  a{color:var(--accent)}
  .err{color:#a33;font-size:13px;margin-top:12px}
  .stat{font-size:12px;color:var(--mute);margin-top:26px;border-top:1px solid var(--line);padding-top:12px}
  .n{display:inline-block;width:20px;color:var(--accent);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>静电薄膜电机 · 文献知识助手</h1>
  <div class="sub" id="sub">加载中…</div>

  <div class="cat" id="cat"></div>

  <div class="bar">
    <textarea id="q" placeholder="例如：静电薄膜电机的推力密度典型值范围是多少？受哪些因素影响？&#10;（Ctrl/⌘ + Enter 提交）"></textarea>
    <div class="opts">
      <select id="mode"><option value="ask">问答</option><option value="search">仅检索</option></select>
      <select id="tier">
        <option value="">全部分级</option>
        <option value="1">① 核心·薄膜电机</option>
        <option value="2">② 静电电机/机械</option>
        <option value="3">③ 电粘附/夹持</option>
        <option value="4">④ 外围</option>
      </select>
      <label>年份 <input type="number" id="y0" placeholder="起"> – <input type="number" id="y1" placeholder="止"></label>
      <label><input type="checkbox" id="exp" checked> 中译英扩写</label>
      <div class="spacer"></div>
      <button class="ghost" id="stop" style="display:none">停止</button>
      <button id="go">提问</button>
    </div>
  </div>

  <div id="err" class="err"></div>
  <div id="ans" class="answer" style="display:none"></div>
  <div id="cards" class="cards"></div>
  <div id="stat" class="stat"></div>
</div>

<script>
const $ = s => document.querySelector(s);
let ctrl = null;

const esc = s => (s||'').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
// 后端 preview 用 【】 标出命中词，这里转成高亮
const mark = s => esc(s).replace(/【(.+?)】/g, '<b>$1</b>');

let CAT = '';   // '' = 全部，否则 film_motor / electroadhesion

fetch('/api/stats').then(r=>r.json()).then(s=>{
  const m = s.mode === 'hybrid' ? `混合检索 · ${s.embed_model||''}` : '⚠ 纯关键词（尚未生成向量，跑 scripts/build_vectors.py）';
  $('#sub').textContent = `${s.papers} 篇论文 · ${s.chunks} 段全文 · ${s.year_min}–${s.year_max} · ${m}`;
  window.__localPdf = s.local_pdf;

  // 两大类切换：一级筛选。未跑 recategorize.py 时整条不显示，功能自动退化为原来的样子
  if(s.has_category && s.categories && s.categories.length){
    const btns = [{key:'', label:'全部', papers:s.papers, chunks:s.chunks}].concat(s.categories);
    $('#cat').innerHTML = btns.map(c=>
      `<button data-k="${c.key}" class="${c.key===CAT?'on':''}">
         <b>${esc(c.label)}</b><span>${c.papers} 篇 · ${c.chunks} 段${c.cross?` · 交叉 ${c.cross}`:''}</span>
       </button>`).join('');
    $('#cat').onclick = e => {
      const b = e.target.closest('button'); if(!b) return;
      CAT = b.dataset.k;
      [...$('#cat').children].forEach(x=>x.classList.toggle('on', x.dataset.k===CAT));
    };
  } else {
    $('#cat').style.display = 'none';
  }
  $('#stat').innerHTML = s.tiers.map(t=>`${esc(t.tier)}: ${t.n} 篇`).join(' &nbsp;·&nbsp; ')
    + `<br>对话模型：${s.provider}`;
}).catch(e=>$('#sub').textContent='后端未就绪：'+e);

function card(h, i){
  const au = (h.authors||'').split(',')[0];
  const routes = Object.entries(h.routes||{}).map(([k,v])=>`${k==='keyword'?'词':'向'}#${v}`).join(' ');
  const pdf = window.__localPdf ? ` · <a href="/api/pdf/${encodeURIComponent(h.file)}" target="_blank">本地 PDF</a>` : '';
  const doi = h.doi ? ` · <a href="https://doi.org/${h.doi}" target="_blank">DOI 原文</a>` : '';
  const CL = {film_motor:['fm','薄膜电机'], electroadhesion:['ea','电粘附']}[h.category];
  const cb = CL ? `<span class="cbadge ${CL[0]}">${CL[1]}</span>` : '';
  const xb = h.cross_topic ? `<span class="cbadge x">交叉</span>` : '';
  return `<div class="card" id="c${i}">
    <div class="ct"><span class="n">[${i}]</span>${esc(h.title)}</div>
    <div class="cm">${cb}${xb}${h.tier?`<span class="badge">${esc(h.tier)}</span>`:''}${esc(au)} et al. · ${h.year||'?'} · ${esc(h.venue||'')} · 第 ${esc(h.page)} 页<span class="rt">${routes}</span>${doi}${pdf}</div>
    <div class="cp">${mark(h.preview)}</div>
  </div>`;
}

function renderCards(hits){
  $('#cards').innerHTML = hits.map((h,i)=>card(h,i+1)).join('');
}
// 回答里的 [n] 变成可点角标，点了滚到对应卡片并闪一下
function linkify(t){
  return esc(t).replace(/\[(\d{1,2})\]/g, (m,n)=>`<sup onclick="jump(${n})">[${n}]</sup>`);
}
window.jump = n => {
  const el = $('#c'+n); if(!el) return;
  el.scrollIntoView({behavior:'smooth',block:'center'});
  el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash');
};

async function run(){
  const query = $('#q').value.trim(); if(!query) return;
  $('#err').textContent=''; $('#cards').innerHTML=''; $('#ans').style.display='none'; $('#ans').innerHTML='';
  const body = {
    query, category: CAT || null, tier: $('#tier').value || null, expand: $('#exp').checked,
    year_min: +$('#y0').value || null, year_max: +$('#y1').value || null,
  };
  $('#go').disabled = true;

  if($('#mode').value === 'search'){
    try{
      const r = await fetch('/api/search',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
      const d = await r.json();
      renderCards(d.hits);
      if(!d.hits.length) $('#err').textContent = '无命中。试试英文术语，或放宽分级/年份筛选。';
    }catch(e){ $('#err').textContent = e; }
    $('#go').disabled = false; return;
  }

  $('#ans').style.display='block'; $('#ans').textContent='检索中…';
  $('#stop').style.display=''; ctrl = new AbortController();
  let raw = '', started = false;
  try{
    const r = await fetch('/api/ask',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify(body), signal:ctrl.signal});
    const rd = r.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while(true){
      const {done, value} = await rd.read(); if(done) break;
      buf += dec.decode(value, {stream:true});
      const blocks = buf.split('\n\n'); buf = blocks.pop();
      for(const b of blocks){
        const ev = (b.match(/^event: (.+)$/m)||[])[1];
        const dm = (b.match(/^data: ([\s\S]+)$/m)||[])[1];
        if(!ev || !dm) continue;
        const d = JSON.parse(dm);
        if(ev==='sources'){ renderCards(d.hits); $('#ans').textContent='生成中…'; }
        else if(ev==='token'){ if(!started){ started=true; $('#ans').innerHTML=''; } raw += d.t; $('#ans').innerHTML = linkify(raw); }
        else if(ev==='error'){ $('#err').textContent = d.msg; }
      }
    }
  }catch(e){ if(e.name!=='AbortError') $('#err').textContent = e; }
  $('#stop').style.display='none'; $('#go').disabled=false; ctrl=null;
}

$('#go').onclick = run;
$('#stop').onclick = ()=>ctrl && ctrl.abort();
$('#mode').onchange = e => $('#go').textContent = e.target.value==='ask' ? '提问' : '检索';
$('#q').addEventListener('keydown', e=>{ if((e.metaKey||e.ctrlKey) && e.key==='Enter') run(); });
</script>
</body>
</html>
