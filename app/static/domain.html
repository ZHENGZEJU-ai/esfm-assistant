<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>领域概览 · 静电科研知识库</title>
<style>
  :root{--bg:#faf9f7;--card:#fff;--ink:#1c1b19;--mute:#6b6862;--faint:#9a958d;
        --line:#e5e2dc;--accent:#8a5a2b;--hl:#fdf0d5;--sea:#f2f0ec;
        --fm:#2b5d8a;--fmbg:#eef4fb;--ea:#7a3d8a;--eabg:#f6eef8;
        --key:#8a5a2b;--keybg:#fdf0d5;--keyline:#f0dcb4}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:26px 24px 80px}
  .top{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  h1{font-size:23px;margin:0;letter-spacing:-.2px}
  a.nav{font-size:12.5px;color:var(--mute);text-decoration:none;white-space:nowrap}
  a.nav:hover{color:var(--key)}
  .lead{color:var(--mute);font-size:13.5px;margin-bottom:26px}
  h2{font-size:15px;margin:0 0 3px;letter-spacing:.3px}
  .h2sub{font-size:12px;color:var(--faint);margin-bottom:14px}
  section{margin-top:44px}

  .nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:1px;
        background:var(--line);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .nums div{background:var(--card);padding:15px 14px}
  .nums b{display:block;font-size:24px;font-weight:600;letter-spacing:-.5px;color:var(--key)}
  .nums span{font-size:11.5px;color:var(--mute)}

  .gates{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:26px 0 4px}
  @media(max-width:700px){.gates{grid-template-columns:1fr}}
  .gate{background:var(--card);border:1px solid var(--line);border-radius:13px;
        padding:20px 22px 17px;text-decoration:none;color:inherit;display:block;
        transition:border-color .16s, transform .16s, box-shadow .16s}
  .gate:hover{border-color:var(--key);transform:translateY(-2px);box-shadow:0 6px 18px rgba(0,0,0,.06)}
  .gate b{display:block;font-size:16px;margin-bottom:4px}
  .gate p{margin:0;font-size:12.5px;color:var(--mute);line-height:1.65}
  .gate .go{margin-top:11px;font-size:12.5px;color:var(--key)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th{text-align:left;font-weight:600;color:var(--mute);font-size:11.5px;
     border-bottom:1px solid var(--line);padding:7px 8px;white-space:nowrap}
  td{padding:7px 8px;border-bottom:1px solid #f2efe9}
  tr:last-child td{border-bottom:0}
  td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
  .empty{color:var(--faint);font-size:12.5px;padding:16px;text-align:center;
         background:var(--card);border:1px dashed var(--line);border-radius:12px}
  .bar{height:5px;background:var(--keybg);border-radius:3px;display:inline-block;vertical-align:middle}
  .grid2{display:grid;grid-template-columns:1fr 290px;gap:20px;align-items:start}
  @media(max-width:800px){.grid2{grid-template-columns:1fr}}
  .foot{margin-top:50px;padding-top:16px;border-top:1px solid var(--line);
        font-size:11.5px;color:var(--faint)}
  .metric{margin-bottom:20px}
  .metric h3{font-size:13px;margin:0 0 2px;font-weight:600}
  .metric .rng{font-size:11.5px;color:var(--faint);margin-bottom:7px}
  a{color:var(--key)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1 id="title">加载中…</h1>
    <a class="nav" href="/">← 选择方向</a>
  </div>
  <div class="lead" id="lead"></div>

  <div class="nums" id="nums"></div>

  <div class="gates">
    <a class="gate" id="g-search" href="#">
      <b>知识库</b>
      <p>在本方向全部论文的全文里做混合检索，提问后给出带页码引用的回答。</p>
      <div class="go">进入 →</div>
    </a>
    <a class="gate" id="g-learn" href="#">
      <b>学习路径</b>
      <p>提出问题，得到一张学习路径树状图，每个分支上挂着该阶段该读的论文。</p>
      <div class="go">进入 →</div>
    </a>
  </div>

  <section>
    <h2>性能 benchmark</h2>
    <div class="h2sub">从论文正文抽取的实测值，已做单位归一。每个数值都连同实验条件一起记录 —— 脱离电压、间距、介质的性能数字没有意义。</div>
    <div id="bench"></div>
  </section>

  <section>
    <h2>研究人员</h2>
    <div class="h2sub">按发文量排序。同一作者的不同署名写法（Toshiro Higuchi / T. Higuchi）已归并。</div>
    <div class="card" style="padding:4px 10px"><table id="authors"></table></div>
  </section>

  <section>
    <h2>地域分布</h2>
    <div class="h2sub">按通讯作者机构所在国家统计，圆点面积对应论文数。</div>
    <div class="grid2">
      <div class="card" id="mapbox"></div>
      <div class="card" style="padding:4px 10px"><table id="ctable"></table></div>
    </div>
  </section>

  <section>
    <h2>高被引论文</h2>
    <div class="h2sub">被引数据来自 OpenAlex。</div>
    <div class="card" style="padding:4px 10px"><table id="toppapers"></table></div>
  </section>

  <div class="foot" id="foot"></div>
</div>

<script src="/worldmap.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

// 领域从 URL 第一段读出来：/fm /ea /all。三个领域复用这一个文件。
const SLUG = (location.pathname.split('/')[1] || 'all');
const META = {
  fm : {name:'静电薄膜电机',      en:'Electrostatic Film Motor', color:'#2b5d8a', bg:'#eef4fb', line:'#cfe0f2'},
  ea : {name:'静电吸附 / 电粘附',  en:'Electroadhesion',          color:'#7a3d8a', bg:'#f7eff9', line:'#e7d3ee'},
  all: {name:'全库视图',          en:'All Topics',               color:'#8a5a2b', bg:'#fdf0d5', line:'#f0dcb4'},
}[SLUG] || {name:'全库视图', en:'All', color:'#8a5a2b', bg:'#fdf0d5', line:'#f0dcb4'};

document.documentElement.style.setProperty('--key', META.color);
document.documentElement.style.setProperty('--keybg', META.bg);
document.documentElement.style.setProperty('--keyline', META.line);
document.title = META.name + ' · 静电科研知识库';
$('#title').textContent = META.name;
$('#g-search').href = `/${SLUG}/search`;
$('#g-learn').href  = `/${SLUG}/learn`;

const CAT = {film_motor:['fm','薄膜电机'], electroadhesion:['ea','电粘附']};
const catTag = c => CAT[c] ? `<span style="display:inline-block;font-size:10px;padding:1px 6px;border-radius:20px;
  background:${c==='film_motor'?'#eef4fb':'#f6eef8'};color:${c==='film_motor'?'#2b5d8a':'#7a3d8a'};
  border:1px solid ${c==='film_motor'?'#d3e2f2':'#e8d6ee'}">${CAT[c][1]}</span>` : '';

// 气泡图 + 真实陆地底图。国界数据来自 /worldmap.js（构建期烘出，108 KB），
// 不走任何 CDN —— 国内网络与 Render 上都不会加载失败。
function worldMap(countries){
  const W = window.WORLD;
  if(!W) return `<div class="empty">地图数据未加载<br>跑 <code>python scripts/build_worldmap.py</code></div>`;
  if(!countries || !countries.length)
    return `<div class="empty">本方向暂无地域数据<br>跑 <code>python scripts/extract_meta.py --what geo</code></div>`;

  const MERGE_INTO = {tw:'cn', hk:'cn', mo:'cn'};   // 与 analytics.py 的 REGION_MERGE 一致
  const by = {}; const unmapped = [];
  countries.forEach(c=>{ const a2=W.iso3to2[c.iso3]; a2 ? by[a2]=c : unmapped.push(c.iso3); });
  Object.entries(MERGE_INTO).forEach(([p,m])=>{ if(by[m] && !by[p]) by[p]=by[m]; });

  const max = Math.max(...countries.map(c=>c.papers));
  const rOf = n => 22 + 88*Math.sqrt(n/max);   // 面积正比于论文数，不夸大差距
  const hueOf = c => {
    const s = c.electroadhesion/(c.papers||1);
    return s>0.6 ? [122,61,138] : (s<0.35 ? [43,93,138] : [107,90,138]);
  };
  const land = Object.values(W.paths).map(d =>
    `<path d="${d}" fill="#e4e1da" stroke="#f2f0ec" stroke-width="1.2"/>`).join('');
  // 圆心用地图数据自带的质心（从国界路径算出），必然落在对应陆地上
  const bubbles = countries.filter(c=>W.centroids[W.iso3to2[c.iso3]])
    .sort((a,b)=>b.papers-a.papers)            // 大的先画，小的压在上面不被遮住
    .map(c=>{
      const [x,y]=W.centroids[W.iso3to2[c.iso3]], [r,g,b]=hueOf(c);
      return `<g><title>${esc(c.country)}：${c.papers} 篇 · 被引 ${c.cited}</title>
        <circle cx="${x}" cy="${y}" r="${rOf(c.papers).toFixed(0)}" fill="rgb(${r},${g},${b})"
                fill-opacity=".45" stroke="rgb(${r},${g},${b})" stroke-width="3"/></g>`;
    }).join('');
  const placed=[];
  const labels = countries.filter(c=>W.centroids[W.iso3to2[c.iso3]]).slice(0,6).map(c=>{
    const [x,y]=W.centroids[W.iso3to2[c.iso3]];
    if(placed.some(p=>Math.abs(p[0]-x)<200 && Math.abs(p[1]-y)<120)) return '';
    placed.push([x,y]);
    return `<text x="${x}" y="${(y-rOf(c.papers)-14).toFixed(0)}" text-anchor="middle"
            font-size="46" font-weight="600" fill="#5f5c56">${esc(c.iso3)}</text>`;
  }).join('');
  return `<svg viewBox="20 0 2460 1110" style="width:100%;height:auto;display:block;background:var(--sea);border-radius:6px">
      <g>${land}</g>${bubbles}${labels}
    </svg>
    <div style="font-size:11px;color:var(--faint);margin-top:10px;line-height:1.9">
      圆点位置为国家几何中心，面积正比于论文数 · 悬停查看明细
      ${unmapped.length?`<br>另有 ${unmapped.length} 条国别无法对应到地图：${unmapped.map(esc).join(' ')}`:''}
    </div>`;
}

const qs = SLUG==='all' ? '' : `?domain=${SLUG}`;

fetch('/api/overview'+qs).then(r=>r.json()).then(o=>{
  const t=o.totals;
  $('#lead').textContent = `${META.en} · ${t.papers} 篇论文 · ${t.year_min}–${t.year_max}`;
  $('#nums').innerHTML = [
    ['论文', t.papers], ['总被引', t.cited.toLocaleString()],
    ['研究人员', t.authors], ['机构', t.institutions || '—'],
    ['国家/地区', t.countries || '—'], ['跨度', (t.year_max-t.year_min)+' 年'],
  ].map(([k,v])=>`<div><b>${v}</b><span>${k}</span></div>`).join('');

  const maxP = Math.max(...o.authors.map(a=>a.papers), 1);
  $('#authors').innerHTML = `<tr><th>研究者</th><th class="n">论文</th><th class="n">一作</th>
      <th class="n">被引</th><th>活跃年代</th>${SLUG==='all'?'<th>方向</th>':''}</tr>` +
    o.authors.map(a=>`<tr>
      <td>${esc(a.name)}<span class="bar" style="width:${(a.papers/maxP*56).toFixed(0)}px;margin-left:8px"></span></td>
      <td class="n">${a.papers}</td><td class="n">${a.first_author}</td>
      <td class="n">${a.cited}</td><td style="color:var(--mute)">${esc(a.span)}</td>
      ${SLUG==='all'?`<td>${catTag(a.main_cat)}</td>`:''}</tr>`).join('');

  $('#mapbox').innerHTML = worldMap(o.countries||[]);
  $('#ctable').innerHTML = (o.countries||[]).length
    ? `<tr><th>国家/地区</th><th class="n">论文</th><th class="n">被引</th></tr>` +
      o.countries.slice(0,14).map(c=>`<tr><td>${esc(c.country)}</td>
        <td class="n">${c.papers}</td><td class="n">${c.cited}</td></tr>`).join('')
    : `<tr><td style="color:var(--faint);font-size:12px;padding:14px 8px">待生成</td></tr>`;

  $('#toppapers').innerHTML = `<tr><th class="n">被引</th><th>标题</th><th class="n">年份</th></tr>` +
    o.top_papers.map(p=>`<tr><td class="n"><b>${p.cited}</b></td>
      <td>${p.doi?`<a href="https://doi.org/${esc(p.doi)}" target="_blank">${esc(p.title)}</a>`:esc(p.title)}
        <div style="font-size:11px;color:var(--faint)">${esc(p.venue||'')}</div></td>
      <td class="n" style="color:var(--mute)">${p.year||''}</td></tr>`).join('');

  $('#foot').innerHTML = `数据范围：${esc(META.name)}，共 ${t.papers} 篇。`
    + (t.geo_coverage ? ` 地域覆盖 ${t.geo_coverage}/${t.papers} 篇。` : '')
    + `　交叉主题的论文在两个方向下都会出现。`;
}).catch(e=>$('#lead').textContent='后端未就绪：'+e);

fetch('/api/benchmarks'+qs).then(r=>r.json()).then(b=>{
  if(!b.available){ $('#bench').innerHTML = `<div class="empty">${esc(b.note||'本方向暂无性能数据')}</div>`; return; }
  const order = ['thrust_density','shear_stress','normal_pressure','thrust','holding_force','speed','efficiency'];
  const keys = order.filter(k=>b.metrics[k]);
  $('#bench').innerHTML = `<div class="card">` + keys.map(k=>{
    const m=b.metrics[k], s=m.stats;
    // 对数刻度：静电力的性能数据常跨两三个数量级，线性轴会把小值全挤在左边
    const lo=Math.log10(s.min||1e-3), hi=Math.log10(s.max||1), span=(hi-lo)||1;
    const pos = v => ((Math.log10(v)-lo)/span*100);
    const pts = m.points.slice(0,60).map(p=>{
      const cond=[p.voltage_kv?`${p.voltage_kv} kV`:null, p.gap_um?`${p.gap_um} µm`:null, p.medium].filter(Boolean).join(' · ');
      const col = p.category==='electroadhesion' ? 'var(--ea)' : 'var(--fm)';
      return `<div title="${esc(p.title)}（${p.year||''}）第${esc(p.page)}页&#10;${p.raw} ${esc(p.raw_unit||'')}${cond?'\n条件：'+esc(cond):''}"
        style="position:absolute;left:${pos(p.value).toFixed(1)}%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;
        border-radius:50%;background:${col};opacity:.5"></div>`;
    }).join('');
    return `<div class="metric">
      <h3>${esc(m.label)} <span style="font-weight:400;color:var(--faint)">${esc(m.unit)}</span></h3>
      <div class="rng">${s.n} 个数据点 · 中位 ${s.median.toPrecision(3)} · 范围 ${s.min.toPrecision(3)} – ${s.max.toPrecision(3)}（对数轴）</div>
      <div style="position:relative;height:26px;background:var(--bg);border-radius:5px;border:1px solid var(--line)">${pts}</div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--faint);margin-top:3px">
        <span>${s.min.toPrecision(3)}</span><span>${s.max.toPrecision(3)}</span></div>
    </div>`;
  }).join('') + `<div style="font-size:11px;color:var(--faint);border-top:1px solid var(--line);padding-top:10px">
      悬停查看出处与实验条件。
      ${b.dropped_unknown_unit?`剔除 ${b.dropped_unknown_unit} 条（单位无法识别或数值不合物理，不做猜测换算）`:''}
      ${b.deduped?`　· 合并重复 ${b.deduped} 条`:''}
    </div></div>`;
}).catch(e=>$('#bench').innerHTML=`<div class="empty">${esc(e)}</div>`);
</script>
</body>
</html>
